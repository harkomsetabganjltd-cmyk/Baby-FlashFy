name: Build FlashFy Baby

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          test -f FlashFy_com.chowdhuryelab.flashfy.zip
          test -f flashfy_baby_background.jpg

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Apktool
        run: curl -L --fail -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar

      - name: Extract APK
        run: |
          mkdir -p input
          unzip -q FlashFy_com.chowdhuryelab.flashfy.zip -d input
          test -f input/base.apk
          test -f input/split_config.arm64_v8a.apk

      - name: Decode
        run: java -jar apktool.jar d -f input/base.apk -o decoded

      - name: Add baby image
        run: |
          mkdir -p decoded/res/drawable-nodpi
          cp flashfy_baby_background.jpg decoded/res/drawable-nodpi/flashfy_baby_background.jpg

      - name: Create patch script
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > patch.py
          MAIN="$(find decoded/smali* -type f -path '*/com/chowdhuryelab/flashfy/MainActivity.smali' | head -1)"
          test -n "$MAIN"
          python3 patch.py "$MAIN"

      - name: Build patched base
        run: java -jar apktool.jar b decoded -o patched-base.apk

      - name: Create overlay controller
        env:
          JAVA_B64: 
        run: echo "$JAVA_B64" | base64 -d > OverlayController.java

      - name: Compile controller
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          mkdir -p helper_classes helper_dex
          javac -source 8 -target 8 -classpath "$ANDROID_JAR" -d helper_classes OverlayController.java
          "$D8" --min-api 23 --lib "$ANDROID_JAR" --output helper_dex helper_classes

      - name: Merge controller
        run: |
          mkdir -p apk_unpacked merged_dex
          unzip -q patched-base.apk -d apk_unpacked
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 23 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output merged_dex apk_unpacked/classes.dex helper_dex/classes.dex
          cp merged_dex/classes.dex apk_unpacked/classes.dex
          cd apk_unpacked
          zip -qr ../unsigned.apk .
          cd ..

      - name: Add arm64 libraries
        run: |
          mkdir -p arm64
          unzip -q input/split_config.arm64_v8a.apk 'lib/arm64-v8a/*' -d arm64
          mkdir -p apk_unpacked/lib
          cp -r arm64/lib/arm64-v8a apk_unpacked/lib/
          cd apk_unpacked
          rm -f ../unsigned.apk
          zip -qr ../unsigned.apk .
          cd ..

      - name: Align and sign
        run: |
          keytool -genkeypair -v -keystore flashfy.jks -storepass android -keypass android -alias flashfy -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FlashFy Baby,O=FlashFy,C=BD"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks flashfy.jks --ks-pass pass:android --key-pass pass:android --ks-key-alias flashfy --out FlashFy-Baby.apk aligned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify FlashFy-Baby.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlashFy-Baby
          path: FlashFy-Baby.apk
